name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/verify_public_source_boundary.py
      - run: python -m compileall -q epm_core openepm scripts platform_postgres_mcp_http.py platform_postgres_mcp_server.py platform_postgres_platform_browser_http.py platform_postgres_platform_mcp_http.py platform_postgres_platform_mcp_server.py platform_postgres_reset_mcp_http.py platform_postgres_reset_mcp_server.py platform_postgres_router_mcp_http.py platform_postgres_router_mcp_server.py platform_postgres_web_http.py platform_postgres_workspace_mcp_http.py platform_postgres_workspace_mcp_server.py

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
