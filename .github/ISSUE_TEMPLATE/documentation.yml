name: Documentation improvement
description: Report missing, unclear, or incorrect repository documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
