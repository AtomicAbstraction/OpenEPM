receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
  hostmetrics:
    # The standard filesystem scraper emits system.filesystem.utilization.
    collection_interval: 30s
    scrapers:
      filesystem:
        include:
          mount_points:
            - /var/lib/openepm/metrics/epm_pgdata
            - /var/lib/openepm/metrics/epm_control_pgdata
          match_type: strict
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - {key: enduser.id, action: delete}
      - {key: user.id, action: delete}
      - {key: tenant.id, action: delete}
      - {key: db.statement, action: delete}
      - {key: http.request.header.authorization, action: delete}
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
  debug:
    verbosity: basic
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [debug]
